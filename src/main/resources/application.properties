# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sundaysoul?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.application.name=sundaysoul-backend

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.travelcommunity=DEBUG

# ===============================
# Mail Configuration (HTTPS API & SMTP)
# ===============================
mail.api.key=${RESEND_API_KEY:${MAIL_API_KEY:}}
mail.api.from=${MAIL_FROM:SundaySoul <onboarding@resend.dev>}

spring.mail.host=${SPRING_MAIL_HOST:smtp.zoho.in}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.debug=true